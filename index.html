<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>Family Food Plan</title>
<style>
  :root { --bg:#0e1014; --surface:#171a21; --surface2:#1f232c; --line:#292e39; --ink:#e9ebf1; --muted:#8a92a3; --accent:#ff8f45; --accent2:#ff6b7a; --ok:#4cc38a; --warn:#e6b84f; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); line-height:1.4; padding-bottom:100px; }
  header { position:sticky; top:0; z-index:10; background:rgba(14,16,20,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .wrap { max-width:900px; margin:0 auto; padding:0 18px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 0 8px; }
  h1 { margin:0; font-size:1.25rem; letter-spacing:-.01em; }
  h3 { margin:22px 0 10px; font-size:1rem; color:var(--muted); font-weight:600; }
  #syncStatus { display:block; font-size:.75rem; color:var(--muted); margin-top:2px; font-weight:400; letter-spacing:0; }
  #undoBtn { white-space:nowrap; flex:none; }
  nav { display:flex; gap:4px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:1 0 auto; background:transparent; border:1px solid transparent; color:var(--muted); padding:8px 14px; border-radius:999px; font:inherit; font-size:.95rem; cursor:pointer; white-space:nowrap; }
  nav button.active { background:var(--surface2); color:var(--ink); border-color:var(--line); font-weight:600; }
  main { max-width:900px; margin:0 auto; padding:18px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
  .btn { font:inherit; font-weight:600; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1b0e06; border:none; border-radius:10px; padding:10px 16px; cursor:pointer; }
  .btn.secondary { background:var(--surface2); color:var(--ink); border:1px solid var(--line); font-weight:500; }
  .btn.small { padding:6px 11px; font-size:.85rem; border-radius:8px; }
  .btn:hover { filter:brightness(1.08); }
  .btn:disabled { opacity:.35; cursor:default; filter:none; }
  input[type=text], textarea, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:var(--surface2); color:var(--ink); }
  input[type=text]:focus, textarea:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  input[type=checkbox] { accent-color:var(--accent); width:20px; height:20px; flex:none; }
  textarea { min-height:90px; resize:vertical; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:120px; }
  .muted { color:var(--muted); }
  .hidden { display:none !important; }
  code { background:var(--surface2); padding:1px 6px; border-radius:5px; font-size:.85em; }
  .chk { display:flex; align-items:center; gap:8px; color:var(--ink); font-size:1rem; margin-top:10px; cursor:pointer; }
  details.card summary { list-style:revert; cursor:pointer; font-weight:600; }

  /* Week */
  .day { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px 10px; align-items:center; }
  .day.locked { border-color:var(--accent); }
  .day.made { border-left:4px solid var(--ok); }
  .day.over { outline:2px dashed var(--accent); outline-offset:2px; }
  .day.dragging { opacity:.45; }
  body.dragging-now { user-select:none; -webkit-user-select:none; cursor:grabbing; }
  .handle { cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; color:var(--muted); font-size:1.4rem; padding:6px 4px; border-radius:8px; line-height:1; }
  .handle:hover { color:var(--ink); background:var(--surface2); }
  .dname { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); }
  .dish strong { display:block; font-size:1.05rem; }
  .dish small { color:var(--muted); }
  .day.made .dish strong { color:var(--muted); }
  .dish { min-width:0; overflow-wrap:anywhere; }
  .acts { display:flex; gap:6px; align-items:center; }
  .pickrow { grid-column:1 / -1; }
  .pickrow select { width:100%; min-width:0; padding:8px 10px; font-size:.9rem; }
  .cookrow { grid-column:1 / -1; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-top:8px; border-top:1px dashed var(--line); }
  .cookrow .chk { margin:0; font-size:.95rem; }
  .pill { font:inherit; font-size:.85rem; border:1px solid var(--line); background:var(--surface2); color:var(--muted); border-radius:999px; padding:4px 12px; cursor:pointer; }
  .pill.on { background:rgba(76,195,138,.15); border-color:var(--ok); color:var(--ok); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { background:var(--surface2); border:1px solid var(--line); border-radius:999px; padding:3px 11px; font-size:.82rem; display:inline-flex; align-items:center; gap:6px; color:var(--ink); }
  .chip.needed { border-color:var(--accent); }
  .chip button { background:none; border:none; color:var(--muted); cursor:pointer; padding:0; font-size:1rem; line-height:1; }
  .chip button:hover { color:var(--ink); }
  .warnbox { border-color:var(--warn); background:rgba(230,184,79,.08); }

  /* History */
  .hist { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .hist:last-child { border-bottom:none; }
  .hist .when { width:96px; color:var(--muted); font-size:.85rem; flex:none; }

  /* Shopping */
  ul.shop { list-style:none; padding:0; margin:0; }
  ul.shop li { padding:9px 2px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  ul.shop li:last-child { border-bottom:none; }
  ul.shop li.done span.lbl { text-decoration:line-through; color:var(--muted); }
  .count { color:var(--muted); font-size:.8rem; }
  .gh { margin:0 0 4px; font-size:.9rem; display:flex; justify-content:space-between; align-items:center; }
  .gh .count { font-weight:400; }
  .tag { font-size:.7rem; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:0 7px; margin-left:6px; }
  .grpsel { width:auto !important; padding:4px 8px !important; font-size:.8rem !important; }

  .empty { text-align:center; padding:40px 16px; }
  .empty .big { font-size:2.4rem; }

  /* Toast */
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom)); background:var(--surface2); border:1px solid var(--line); box-shadow:0 8px 30px rgba(0,0,0,.5); border-radius:12px; padding:10px 14px; display:flex; gap:14px; align-items:center; z-index:20; max-width:92vw; }
  .toast button { background:none; border:none; color:var(--accent); font:inherit; font-weight:700; cursor:pointer; }

  .bar { height:8px; background:var(--surface2); border-radius:999px; overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s; }
  ul.shop .lbl { min-width:0; overflow-wrap:anywhere; }
  ul.shop .cedit { min-width:0; padding:7px 9px; }
  details.card .card { background:var(--surface2); margin:10px 0 0; }
  .card.tried { opacity:.7; }
  @media (max-width:600px){ main { padding:14px; } nav button { padding:8px 11px; font-size:.9rem; } }
  @media (max-width:380px){ nav button { padding:8px 8px; font-size:.85rem; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>🍽️ Family Food Plan <span id="syncStatus"></span></h1>
      <button class="btn secondary small" id="undoBtn" disabled>↩ Undo</button>
    </div>
    <nav>
      <button data-tab="week" class="active">Week</button>
      <button data-tab="dishes">Dishes</button>
      <button data-tab="shop">Shop</button>
      <button data-tab="haruki">Haruki</button>
      <button data-tab="clean">Clean</button>
    </nav>
  </div>
</header>
<main>
  <section id="tab-week"></section>
  <section id="tab-dishes" class="hidden"></section>
  <section id="tab-shop" class="hidden"></section>
  <section id="tab-haruki" class="hidden"></section>
  <section id="tab-clean" class="hidden"></section>
</main>
<div id="toast" class="toast hidden"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const KEY = "familyFoodPlan.v1";   // same key as before, so data already on a device is kept
const DATA_V = 4;                   // bump when the saved data shape changes
const DAY_MS = 864e5;
const HISTORY_DAYS = 28;            // "made" history is kept for 4 weeks
const RECENT_DAYS = 7;              // generator avoids dishes made in the last week
const TYPES = [["chicken","🍗 Chicken"],["beef","🥩 Beef / minced meat"],["pork","🐖 Pork"],["fish","🐟 Fish / seafood"],["veg","🥦 Vegetarian"],["other","🍝 Other"]];
const COOKS = { mom: "👩 Mom", dad: "👨 Dad" };
const ROOMS = [["all","🏠 All rooms"],["office","💼 Office"],["haruki","👶 Haruki's room"],["master","🛏️ Master bedroom"],["kitchen","🍳 Kitchen & living room"],["bath","🛁 Bathroom & toilet"]];
const CLEAN_DEFAULTS = [
  ["all", ["Vacuum all rooms","Wash floors in all rooms","Empty all bins","Wipe door handles & light switches","Open windows to air out","Clear clutter off floors & surfaces"]],
  ["office", ["Tidy desk & put papers away","Dust surfaces & screens","Hide cables & loose items"]],
  ["haruki", ["Tidy away toys & baby things","Make the cot / bed","Tidy the changing area","Dust surfaces"]],
  ["master", ["Make the bed","Clear floor & bedside tables","Dust surfaces","Tidy wardrobe & put clothes away"]],
  ["kitchen", ["Clear & wipe counters","Wash up & empty the dishwasher","Wipe stove top & sink","Wipe fridge front & appliances","Wipe dining table","Tidy sofa & cushions","Dust surfaces & TV"]],
  ["bath", ["Clean toilet bowl & seat","Clean sink, tap & mirror","Clean shower / bath","Hang fresh towels","Put products away"]]
];
// fixed ids, so two devices that seed the list separately still agree on it
function defaultCleaning() {
  const out = [];
  CLEAN_DEFAULTS.forEach(([room, tasks]) => tasks.forEach((text, i) => out.push({ id: "c_" + room + "_" + i, room, text, done: false, who: "" })));
  return out;
}
const $ = id => document.getElementById(id);

function defaultSettings() { return { maxType: 2, minFish: 1, weekend: true, excluded: [] }; }
function ensureState() {
  const s = Object.assign(defaultSettings(), state.settings || {});
  if (!Array.isArray(s.excluded)) s.excluded = [];
  state.settings = s;
  if (!Array.isArray(state.dishes)) state.dishes = [];
  if (!Array.isArray(state.pantry)) state.pantry = [];
  if (!Array.isArray(state.extras)) state.extras = [];
  if (!Array.isArray(state.history)) state.history = [];
  if (!Array.isArray(state.haruki)) state.haruki = [];
  if (!Array.isArray(state.cleaning)) state.cleaning = defaultCleaning();
  if (!state.groupOverride || typeof state.groupOverride !== "object") state.groupOverride = {};
  if (!state.checked || typeof state.checked !== "object") state.checked = {};
  if (!state.week || typeof state.week !== "object") state.week = {};
  state.v = DATA_V;
  pruneHistory();
}
function pruneHistory() {
  const cutoff = Date.now() - HISTORY_DAYS * DAY_MS;
  state.history = state.history.filter(h => h && h.ts >= cutoff);
}

const SEED = {
  dishes: [
    {"id": "d1", "name": "Salmon with rice", "type": "fish", "weekend": false, "ingredients": ["laksefilet", "ris", "brokkoli", "soyasaus", "sitron"]},
    {"id": "d2", "name": "Chicken with estragon", "type": "chicken", "weekend": false, "ingredients": ["kyllingfilet", "estragon", "matfløte", "løk", "ris"]},
    {"id": "d3", "name": "Indian curry", "type": "chicken", "weekend": false, "ingredients": ["kyllingfilet", "indisk karripasta", "kokosmelk", "hermetiske tomater", "løk", "hvitløk", "ris", "naanbrød"]},
    {"id": "d4", "name": "Pizza", "type": "other", "weekend": false, "ingredients": ["pizzabunner", "pizzasaus", "revet ost", "skinke", "pepperoni", "paprika", "champignon"]},
    {"id": "d5", "name": "Taco", "type": "beef", "weekend": false, "ingredients": ["tacoskjell", "kjøttdeig", "tacokrydder", "tacosaus", "salat", "tomat", "agurk", "mais", "rømme", "revet ost"]},
    {"id": "d6", "name": "Thai red curry with beans", "type": "veg", "weekend": false, "ingredients": ["rød karripasta", "kokosmelk", "kidneybønner", "paprika", "brokkoli", "løk", "ris", "lime"]},
    {"id": "d7", "name": "Lasagna", "type": "beef", "weekend": false, "ingredients": ["lasagneplater", "kjøttdeig", "hermetiske tomater", "tomatpuré", "løk", "hvitløk", "melk", "smør", "hvetemel", "revet ost"]},
    {"id": "d8", "name": "Pork chops", "type": "pork", "weekend": false, "ingredients": ["svinekoteletter", "poteter", "brokkoli", "gulrot", "smør"]},
    {"id": "d9", "name": "Wok", "type": "other", "weekend": false, "ingredients": ["nudler", "wokgrønnsaker", "soyasaus", "hvitløk", "ingefær", "kyllingstrimler"]},
    {"id": "d10", "name": "Steak", "type": "beef", "weekend": true, "ingredients": ["biff (entrecôte eller indrefilet)", "poteter", "bearnaisesaus", "grønne bønner", "smør"]},
    {"id": "d11", "name": "Seasonal weekend meal", "type": "other", "weekend": true, "ingredients": ["(rediger: kjøtt til sesongmiddag, f.eks. lam, fårikål, pinnekjøtt)"]},
    {"id": "d12", "name": "Kjøttkaker", "type": "beef", "weekend": false, "ingredients": ["kjøttkaker (kjøttdeig eller ferdige)", "poteter", "brun saus", "gulrot", "tyttebærsyltetøy"]},
    {"id": "d13", "name": "Pitabread", "type": "other", "weekend": false, "ingredients": ["pitabrød", "kyllingstrimler", "salat", "tomat", "agurk", "rødløk", "hvitløksdressing", "fetaost"]},
    {"id": "d14", "name": "Pasta with minced meat and dried tomato", "type": "beef", "weekend": false, "ingredients": ["pasta", "kjøttdeig", "soltørkede tomater", "løk", "hvitløk", "matfløte", "parmesan"]},
    {"id": "d15", "name": "Tuna pesto pasta", "type": "fish", "weekend": false, "ingredients": ["pasta", "tunfisk på boks", "grønn pesto", "cherrytomater", "parmesan"]}
  ],
  week: {},
  checked: {}
};

let state = load();
ensureState();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign({week:{}, checked:{}, dishes:[], updatedAt:0}, JSON.parse(raw));
  } catch (e) {}
  return Object.assign(JSON.parse(JSON.stringify(SEED)), { updatedAt: 0 });
}
function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function save() { pruneHistory(); state.updatedAt = Date.now(); persistLocal(); schedulePush(); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dishById(id) { return state.dishes.find(d => d.id === id); }
function uid() { return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function parseIngredients(text) { return text.split(/[\n,]+/).map(s => s.trim()).filter(Boolean); }
function newW(dishId, locked) { return { dishId: dishId || null, locked: !!locked, done: false, cook: "", histId: "" }; }

/* ---------- Undo ---------- */
const undoStack = [];
let toastTimer = null;
function showToast(msg, canUndo) {
  $("toastMsg").textContent = msg;
  $("toastUndo").classList.toggle("hidden", !canUndo);
  $("toast").classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 6000);
}
function updateUndoUI() { $("undoBtn").disabled = !undoStack.length; }
// Call BEFORE changing something the user might want to take back.
function snap(label) {
  undoStack.push({ label, data: JSON.stringify(state) });
  if (undoStack.length > 20) undoStack.shift();
  updateUndoUI(); showToast(label, true);
}
function undo() {
  const s = undoStack.pop(); if (!s) return;
  state = JSON.parse(s.data); ensureState();
  save(); render(); updateUndoUI(); showToast("Undone: " + s.label, false);
}

/* ---------- Tabs ---------- */
const TABS = ["week","dishes","shop","haruki","clean"];
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
function showTab(name) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  TABS.forEach(t => $("tab-" + t).classList.toggle("hidden", t !== name));
  render();
}

/* ---------- Made history ---------- */
function removeHist(id) { state.history = state.history.filter(h => h.id !== id); }
function clearDone(w) { if (w.histId) removeHist(w.histId); w.done = false; w.cook = ""; w.histId = ""; }
function markMade(i, on) {
  const w = state.week[i]; if (!w || !w.dishId) return;
  const d = dishById(w.dishId);
  snap(on ? "Marked as made" : "Unmarked");
  if (on) {
    const h = { id: uid(), dishId: w.dishId, name: d ? d.name : "Dish", ts: Date.now(), cook: w.cook || "" };
    w.done = true; w.histId = h.id; state.history.push(h);
  } else clearDone(w);
  save(); render();
}
function setCook(i, who) {
  const w = state.week[i]; if (!w || !w.done) return;
  w.cook = (w.cook === who) ? "" : who;
  const h = state.history.find(x => x.id === w.histId); if (h) h.cook = w.cook;
  save(); render();
}
function deleteHistory(id) {
  snap("Removed from history");
  removeHist(id);
  Object.values(state.week).forEach(w => { if (w && w.histId === id) { w.done = false; w.cook = ""; w.histId = ""; } });
  save(); render();
}
function recentIds() {
  const cutoff = Date.now() - RECENT_DAYS * DAY_MS;
  return new Set(state.history.filter(h => h.ts >= cutoff).map(h => h.dishId));
}
function lastMade(dishId) {
  const t = state.history.filter(h => h.dishId === dishId).map(h => h.ts);
  return t.length ? Math.max(...t) : 0;
}
function ago(ts) {
  const n = Math.floor((Date.now() - ts) / DAY_MS);
  return n <= 0 ? "today" : n === 1 ? "yesterday" : n + " days ago";
}
function fmtDate(ts) { return new Date(ts).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); }

/* ---------- Random generation ---------- */
let genNote = "";
let filtersOpen = false;
const typeOf = id => { const d = dishById(id); return d ? (d.type || "other") : "other"; };
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function typeEmoji(d) { const t = TYPES.find(x => x[0] === (d.type || "other")); return t ? t[1].split(" ")[0] : "🍽️"; }

function candidates(i, week, typeCount, used, rules) {
  const isWeekend = i >= 5;
  return state.dishes.filter(d => {
    const t = d.type || "other";
    if (d.paused) return false;
    if (rules.excluded.includes(t)) return false;
    if (rules.avoidId === d.id) return false;
    if (rules.recent && rules.recent.has(d.id)) return false;
    if (!rules.allowRepeat && used.has(d.id)) return false;
    if (rules.weekend && !isWeekend && d.weekend) return false;
    if (t !== "other") {
      if (rules.maxType && (typeCount[t] || 0) >= rules.maxType) return false;
      if (rules.adjacent) for (const j of [i - 1, i + 1]) { const n = week[j]; if (n && n.dishId && typeOf(n.dishId) === t) return false; }
    }
    return true;
  });
}
function attempt(base, freeDays, rules) {
  const week = Object.assign({}, base);
  const typeCount = {}, used = new Set();
  Object.values(week).forEach(w => { if (!w.dishId) return; used.add(w.dishId); const t = typeOf(w.dishId); typeCount[t] = (typeCount[t] || 0) + 1; });
  const order = shuffle(freeDays);
  const need = Math.max(0, rules.minFish - (typeCount.fish || 0));
  const fishDays = order.slice(0, need);
  const seq = fishDays.concat(order.slice(need));
  for (const i of seq) {
    let c = candidates(i, week, typeCount, used, rules);
    if (fishDays.includes(i)) c = c.filter(d => d.type === "fish");
    if (rules.weekend && i >= 5) { const pref = c.filter(d => d.weekend); if (pref.length) c = pref; }
    if (!c.length) return null;
    const d = c[Math.floor(Math.random() * c.length)];
    week[i] = newW(d.id, false);
    used.add(d.id); const t = d.type || "other"; typeCount[t] = (typeCount[t] || 0) + 1;
  }
  if ((typeCount.fish || 0) < rules.minFish) return null;
  return week;
}
function build(base, freeDays, avoidId) {
  const s = state.settings;
  const rec = recentIds();
  const rules = { excluded: s.excluded, maxType: s.maxType, adjacent: true, weekend: s.weekend,
    minFish: s.excluded.includes("fish") ? 0 : s.minFish, allowRepeat: false, avoidId: avoidId || null,
    recent: rec.size ? rec : null };
  const steps = [
    [null, {}],
    ["avoiding dishes made in the last week", { recent: null }],
    ["same food type on back-to-back days", { adjacent: false }],
    ["the max-per-type limit", { maxType: 0 }],
    ["weekend dishes only on Sat/Sun", { weekend: false }],
    ["the fish requirement (add more fish dishes)", { minFish: 0 }],
    ["no repeated dishes (add more dishes)", { allowRepeat: true }]
  ];
  const relaxed = [];
  for (const [label, change] of steps) {
    if (label) {
      if (!Object.keys(change).some(k => rules[k] !== change[k])) continue;
      Object.assign(rules, change); relaxed.push(label);
    }
    for (let n = 0; n < 150; n++) { const w = attempt(base, freeDays, rules); if (w) return { week: w, relaxed }; }
  }
  return { week: null, relaxed };
}
function relaxNote(relaxed) { return relaxed.length ? "Couldn't follow every filter with your current dishes, so I relaxed: " + relaxed.join(", ") + "." : ""; }

function generateWeek() {
  if (!state.dishes.length) { alert("Add some dishes first."); return; }
  const planned = DAYS.map((_, i) => state.week[i]).filter(w => w && w.dishId);
  const fresh = planned.length > 0 && planned.every(w => w.done);   // whole week cooked -> start a new one
  const base = {}, free = [];
  DAYS.forEach((_, i) => {
    const w = state.week[i];
    if (!fresh && w && (w.locked || w.done) && w.dishId && dishById(w.dishId)) base[i] = Object.assign({}, w); else free.push(i);
  });
  const res = build(base, free);
  if (!res.week) { alert("No dishes match your filters. Check “Include food types” and your paused dishes."); return; }
  snap(fresh ? "New week generated" : "Week generated");
  state.week = res.week;
  genNote = relaxNote(res.relaxed);
  state.checked = {};
  save(); render();
}
function rerollDay(i) {
  const base = {};
  DAYS.forEach((_, j) => { const w = state.week[j]; if (j !== i && w && w.dishId && dishById(w.dishId)) base[j] = w; });
  const cur = state.week[i] || {};
  const res = build(base, [i], cur.dishId);
  if (!res.week || !res.week[i]) { alert("No other dish fits this day with your filters."); return; }
  snap("Dish re-rolled");
  if (cur.done) clearDone(cur);
  state.week[i] = newW(res.week[i].dishId, cur.locked);
  genNote = relaxNote(res.relaxed);
  state.checked = {};
  save(); render();
}
function swapDays(a, b) {
  if (a === b) return;
  snap("Swapped days");
  const wa = state.week[a], wb = state.week[b];
  if (wb) state.week[a] = wb; else delete state.week[a];
  if (wa) state.week[b] = wa; else delete state.week[b];
  state.checked = {};
  save(); render();
}

/* ---------- Drag to swap (works with mouse and touch via the ⠿ handle) ---------- */
function bindDrag(root) {
  root.querySelectorAll("[data-drag]").forEach(h => {
    h.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      const from = +h.dataset.drag, card = h.closest(".day");
      let over = null, lastX = e.clientX, lastY = e.clientY;
      card.classList.add("dragging"); document.body.classList.add("dragging-now");
      try { h.setPointerCapture(e.pointerId); } catch (_) {}
      const clear = () => root.querySelectorAll(".day.over").forEach(x => x.classList.remove("over"));
      const hit = () => {
        const t = document.elementFromPoint(lastX, lastY);
        const c = t && t.closest ? t.closest("[data-day]") : null;
        clear(); over = null;
        if (c && +c.dataset.day !== from) { c.classList.add("over"); over = +c.dataset.day; }
      };
      const move = ev => { lastX = ev.clientX; lastY = ev.clientY; hit(); };
      // keep scrolling while the finger rests near the top or bottom edge, even without moving
      const timer = setInterval(() => {
        if (lastY < 130) { window.scrollBy(0, -12); hit(); }
        else if (lastY > window.innerHeight - 100) { window.scrollBy(0, 12); hit(); }
      }, 16);
      const end = ev => {
        clearInterval(timer);
        h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", end); h.removeEventListener("pointercancel", end);
        clear(); card.classList.remove("dragging"); document.body.classList.remove("dragging-now");
        if (ev.type === "pointerup" && over !== null) swapDays(from, over);
      };
      h.addEventListener("pointermove", move); h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
    });
  });
}

let quickMsg = "";
let quickDraft = "";
const TYPE_ALIASES = {
  chicken:"chicken", kylling:"chicken",
  beef:"beef", kjøtt:"beef", storfe:"beef", minced:"beef", kjøttdeig:"beef",
  pork:"pork", svin:"pork", svinekjøtt:"pork",
  fish:"fish", fisk:"fish", seafood:"fish", sjømat:"fish",
  veg:"veg", vegetarian:"veg", vegetar:"veg", vegan:"veg", vegansk:"veg",
  other:"other", annet:"other"
};
function parseType(t) {
  const w = String(t).toLowerCase().replace(/[^\p{L} ]/gu, " ").trim().split(/\s+/)[0] || "";
  return TYPE_ALIASES[w] || null;
}
function parseDishLine(line) {
  const parts = line.split("|").map(p => p.trim());
  if (parts[0] === "") parts.shift();
  if (parts.length && parts[parts.length - 1] === "") parts.pop();
  if (parts.length < 2) return null;
  const name = parts[0].replace(/^(?:[-*•]\s+|\d+[.)]\s+)/, "").replace(/\*\*/g, "").trim();
  if (!name) return null;
  if (/^(name|dish|navn|rett)$/i.test(name)) return { skip: true };
  let type = parseType(parts[1]), guessed = false;
  if (!type) { type = "other"; guessed = true; }
  let weekend = false, ingredients = [];
  parts.slice(2).forEach(p => {
    if (/^(weekend|helg|🎉)$/i.test(p)) weekend = true;
    else ingredients = ingredients.concat(parseIngredients(p));
  });
  return { name, type, weekend, ingredients, guessed };
}
function addDishesFromText(text) {
  let added = 0, updated = 0; const bad = [], guessed = [];
  text.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
    if (/^[\s|:\-]+$/.test(line)) return;
    const d = parseDishLine(line);
    if (d && d.skip) return;
    if (!d) { bad.push(line); return; }
    if (d.guessed) guessed.push(d.name);
    const ex = state.dishes.find(x => x.name.toLowerCase() === d.name.toLowerCase());
    if (ex) { ex.type = d.type; ex.weekend = d.weekend; if (d.ingredients.length) ex.ingredients = d.ingredients; updated++; }
    else { state.dishes.push({ id: uid(), name: d.name, type: d.type, weekend: d.weekend, ingredients: d.ingredients }); added++; }
  });
  if (added || updated) save();
  let msg = (added || updated) ? `Added ${added}, updated ${updated}.` : "Nothing was added.";
  if (guessed.length) msg += ` Unknown type for ${guessed.join(", ")}, so set to "other".`;
  if (bad.length) msg += ` Couldn't read ${bad.length} line${bad.length === 1 ? "" : "s"} (left in the box). Format: Name | type | ingredients.`;
  return { msg, leftover: bad.join("\n") };
}
function aiPrompt() {
  const pantry = state.pantry.length ? `\nDo not include things we always have at home: ${state.pantry.join(", ")}.` : "";
  return `Write dinner dishes for a Norwegian family, one dish per line, in exactly this format and nothing else (no intro, no numbering, no table):
Name | type | ingredient, ingredient, ingredient
Allowed types: chicken, beef, pork, fish, veg, other. For weekend-only dishes add the word weekend as an extra field: Name | type | weekend | ingredients
Ingredients must be what you buy in a Norwegian grocery store, written in Norwegian (e.g. kjøttdeig, tacoskjell, rømme), without amounts.${pantry}

Ribbe | pork | weekend | svinebuk, rødkål, poteter, brun saus

Dishes I want: `;
}

  ["produce",   /løk|paprika|tomat|agurk|salat|brokkoli|gulrot|potet|sitron|\blime\b|ingefær|champignon|sopp|purre|kål|eple|banan|frukt|avokado|spinat|koriander|persille|basilikum|grønnsak|bær|appelsin|drue|mango|squash|aubergine|selleri|mynte|chili|nepe|ruccola|rødbet/],

];
const GROUP_ORDER = [
  ["produce","🥦 Fruit & veg"], ["meat","🥩 Meat"], ["fish","🐟 Fish"], ["dairy","🧀 Dairy & eggs"],
  ["bakery","🍞 Bread & bakery"], ["pantry","🥫 Dry & canned"], ["sauces","🧂 Sauces & spices"],
  ["frozen","❄️ Frozen"], ["drinks","🥤 Drinks"], ["household","🧻 Household"], ["other","🛒 Other"]
];
const ikey = s => String(s).toLowerCase().trim();
function classify(key) {
  for (const [gid, re] of GROUP_RULES) if (re.test(key)) return gid;
  return "other";
}
function groupOf(label) {
  const k = ikey(label), o = state.groupOverride[k];
  return (o && GROUP_ORDER.some(g => g[0] === o)) ? o : classify(k);
}

/* ---------- Render: Shopping list ---------- */
let shopMode = "week";
const shopPick = new Set();
let groupEdit = false;
let shopFocus = false;

function shopDishes() {
  if (shopMode === "pick") return state.dishes.filter(d => shopPick.has(d.id));
  return DAYS.map((_, i) => { const w = state.week[i]; return w && w.dishId ? dishById(w.dishId) : null; }).filter(Boolean);
}
function shoppingData() {
  const pantry = new Set(state.pantry.map(ikey));
  const map = new Map(), hidden = new Map();
  shopDishes().forEach(d => d.ingredients.forEach(ing => {
    const key = ikey(ing);
    const target = pantry.has(key) ? hidden : map;
    if (target.has(key)) target.get(key).count++; else target.set(key, { key, label: ing, count: 1, src: "dish" });
  }));
  const rows = [...map.values()];
  state.extras.forEach(e => rows.push({ key: "x:" + e.id, label: e.text, count: 1, src: "extra", id: e.id }));
  rows.forEach(r => { r.done = r.src === "extra" ? !!(state.extras.find(e => e.id === r.id) || {}).done : !!state.checked[r.key]; r.group = groupOf(r.label); });
  const groups = GROUP_ORDER.map(([gid, label]) => ({
    gid, label,
    items: rows.filter(r => r.group === gid).sort((a, b) => (a.done - b.done) || a.label.localeCompare(b.label))
  })).filter(g => g.items.length);
  return { groups, rows, hidden: [...hidden.values()] };
}
function addExtras(text) {
  const items = parseIngredients(text);
  if (!items.length) return;
  items.forEach(t => state.extras.push({ id: uid(), text: t, done: false }));
  save();
}
function renderShop() {
  const { groups, rows, hidden } = shoppingData();
  const sorted = state.dishes.slice().sort((a, b) => a.name.localeCompare(b.name));
  const needed = new Set(hidden.map(h => h.key));

  let html = `<div class="card">
      <div class="row"><input type="text" id="extraText" class="grow" placeholder="Add anything: melk, toalettpapir, bananer…" autocomplete="off">
      <button class="btn" id="extraAdd">Add</button></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn ${shopMode === "week" ? "" : "secondary"}" data-mode="week">This week's plan</button>
      <button class="btn ${shopMode === "pick" ? "" : "secondary"}" data-mode="pick">Pick dishes</button>
    </div>`;
  if (shopMode === "pick") {
    html += `<div class="card">
      <div class="row"><strong class="grow">Tick the dishes to shop for</strong>
        <button class="btn secondary small" id="pickWeek">Use this week's</button>
        <button class="btn secondary small" id="pickClear">Clear</button></div>
      ${sorted.map(d => `<label class="chk" style="margin:8px 0 0"><input type="checkbox" data-spick="${d.id}" ${shopPick.has(d.id) ? "checked" : ""}> ${typeEmoji(d)} ${esc(d.name)}</label>`).join("") || `<p class="muted">No dishes yet.</p>`}

  }
  html += `<div class="row" style="margin-bottom:12px">
    <button class="btn secondary small" id="copy">📋 Copy list</button>

  </div>`;
  if (!rows.length) {
    html += `<p class="muted">${shopMode === "pick" ? "Tick one or more dishes above, or add things with the box at the top." : "Nothing to buy yet. Generate a week, or add things with the box at the top."}${hidden.length ? " Everything from the plan is marked as always at home." : ""}</p>`;

      html += `<div class="card"><div class="gh"><strong>${g.label}</strong><span class="count">${left} left</span></div><ul class="shop">` + g.items.map(it => {
        const k = ikey(it.label);
        return `<li class="${it.done ? "done" : ""}">
          <input type="checkbox" ${it.src === "extra" ? `data-x="${esc(it.id)}"` : `data-k="${esc(it.key)}"`} ${it.done ? "checked" : ""}>
          <span class="lbl grow">${esc(it.label)}${it.count > 1 ? ` <span class="count">(used in ${it.count} dishes)</span>` : ""}${it.src === "extra" ? `<span class="tag">extra</span>` : ""}</span>
          ${groupEdit ? `<select class="grpsel" data-grp="${esc(k)}"><option value="">auto</option>${GROUP_ORDER.map(([gid, gl]) => `<option value="${gid}" ${state.groupOverride[k] === gid ? "selected" : ""}>${gl}</option>`).join("")}</select>` : ""}
          ${it.src === "extra" ? `<button class="btn secondary small" data-xdel="${esc(it.id)}" title="Remove">✕</button>` : `<button class="btn secondary small" data-home="${esc(it.key)}" title="We always have this at home, hide it">🏠</button>`}
        </li>`;
      }).join("") + `</ul></div>`;
    });
  }
  html += `<div class="card">
    <div class="gh"><strong>🏠 Always at home (${state.pantry.length})</strong></div>
    <p class="muted" style="margin:4px 0 0;font-size:.85rem">These are never put on the shopping list. Tap 🏠 on a list item to add it here, or type below. Orange outline = used by the current plan, so it's hidden from the list.</p>
    <div class="chips">${state.pantry.length ? state.pantry.map(p => `<span class="chip ${needed.has(ikey(p)) ? "needed" : ""}">${esc(p)}<button data-unhome="${esc(p)}" title="Remove from always-at-home">✕</button></span>`).join("") : `<span class="muted">Nothing yet.</span>`}</div>
    <div class="row" style="margin-top:12px"><input type="text" id="pantryAdd" class="grow" placeholder="Add e.g. salt, olivenolje, hvitløk" autocomplete="off"><button class="btn secondary" id="pantryBtn">Add</button></div>
  </div>`;
  const el = $("tab-shop");
  el.innerHTML = html;

  const addExtra = () => { const inp = el.querySelector("#extraText"); if (!inp.value.trim()) return; addExtras(inp.value); shopFocus = true; renderShop(); };
  el.querySelector("#extraAdd").onclick = addExtra;
  el.querySelector("#extraText").onkeydown = e => { if (e.key === "Enter") addExtra(); };
  if (shopFocus) { shopFocus = false; el.querySelector("#extraText").focus(); }

  el.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { shopMode = b.dataset.mode; renderShop(); });
  el.querySelectorAll("[data-spick]").forEach(cb => cb.onchange = () => { if (cb.checked) shopPick.add(cb.dataset.spick); else shopPick.delete(cb.dataset.spick); renderShop(); });
  const pw = el.querySelector("#pickWeek");
  if (pw) pw.onclick = () => { shopPick.clear(); DAYS.forEach((_, i) => { const w = state.week[i]; if (w && w.dishId) shopPick.add(w.dishId); }); renderShop(); };
  const pc = el.querySelector("#pickClear");
  if (pc) pc.onclick = () => { shopPick.clear(); renderShop(); };

  el.querySelectorAll("input[data-k]").forEach(cb => cb.onchange = () => { state.checked[cb.dataset.k] = cb.checked; save(); renderShop(); });
  el.querySelectorAll("input[data-x]").forEach(cb => cb.onchange = () => { const e = state.extras.find(x => x.id === cb.dataset.x); if (e) e.done = cb.checked; save(); renderShop(); });
  el.querySelectorAll("[data-xdel]").forEach(b => b.onclick = () => { snap("Item removed"); state.extras = state.extras.filter(x => x.id !== b.dataset.xdel); save(); renderShop(); });
  el.querySelectorAll("[data-home]").forEach(b => b.onclick = () => {
    const k = b.dataset.home;
    if (!state.pantry.map(ikey).includes(k)) state.pantry.push(k);
    save(); renderShop();
  });
  el.querySelectorAll("[data-unhome]").forEach(b => b.onclick = () => {
    state.pantry = state.pantry.filter(p => ikey(p) !== ikey(b.dataset.unhome));
    save(); renderShop();
  });
  el.querySelectorAll("[data-grp]").forEach(s => s.onchange = () => {
    if (s.value) state.groupOverride[s.dataset.grp] = s.value; else delete state.groupOverride[s.dataset.grp];
    save(); renderShop();
  });
  const addPantry = () => {
    const inp = el.querySelector("#pantryAdd");
    const seen = new Set(state.pantry.map(ikey));
    parseIngredients(inp.value).map(ikey).forEach(k => { if (!seen.has(k)) { seen.add(k); state.pantry.push(k); } });
    save(); renderShop();
  };
  el.querySelector("#pantryBtn").onclick = addPantry;
  el.querySelector("#pantryAdd").onkeydown = e => { if (e.key === "Enter") addPantry(); };
  el.querySelector("#uncheck").onclick = () => { state.checked = {}; state.extras.forEach(e => e.done = false); save(); renderShop(); };
  const ce = el.querySelector("#clearExtras");
  if (ce) ce.onclick = () => { snap("Ticked extras removed"); state.extras = state.extras.filter(e => !e.done); save(); renderShop(); };
  el.querySelector("#grpEdit").onclick = () => { groupEdit = !groupEdit; renderShop(); };
  el.querySelector("#copy").onclick = async () => {
    const text = groups.map(g => { const it = g.items.filter(i => !i.done); return it.length ? g.label + "\n" + it.map(i => "• " + i.label).join("\n") : ""; }).filter(Boolean).join("\n\n");
    try { await navigator.clipboard.writeText(text); alert("Copied!"); } catch (e) { prompt("Copy this:", text); }
  };
}

/* ---------- Render: Haruki (food ideas) ---------- */
let harukiEditId = null, harukiMsg = "", harukiDraft = "";
// "Name | details" (also copes with numbering, bullets, markdown tables; a line with no | is just a name)
function parseIdeaLine(line) {
  const parts = line.split("|").map(p => p.trim());
  if (parts[0] === "") parts.shift();
  if (parts.length && parts[parts.length - 1] === "") parts.pop();
  if (!parts.length) return null;
  const name = parts[0].replace(/^(?:[-*•]\s+|\d+[.)]\s+)/, "").replace(/\*\*/g, "").trim();
  if (!name) return null;
  if (/^(name|idea|food|dish|navn|rett)$/i.test(name)) return { skip: true };
  return { name, note: parts.slice(1).filter(Boolean).join(" — ") };
}
function addIdeasFromText(text) {
  let added = 0, updated = 0;
  text.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
    if (/^[\s|:\-]+$/.test(line)) return;
    const d = parseIdeaLine(line);
    if (!d || d.skip) return;
    const ex = state.haruki.find(x => x.name.toLowerCase() === d.name.toLowerCase());
    if (ex) { if (d.note) ex.note = d.note; updated++; }
    else { state.haruki.push({ id: uid(), name: d.name, note: d.note, tried: false }); added++; }
  });
  if (added || updated) save();
  return (added || updated) ? `Added ${added}, updated ${updated}.` : "Nothing was added.";
}
function ideaPrompt() {
  return `Write food ideas for my baby, one idea per line, in exactly this format and nothing else (no intro, no numbering, no table):
Name | details
"details" is one or two short sentences about what it actually is: the main ingredients, the texture or how it is served (for example mashed, soft finger food, puree) and a quick how-to if it is simple.
Keep everything age-appropriate and safe for a baby (no honey before 12 months, no added salt, avoid choking hazards).
Example:
Sweet potato mash | Steamed sweet potato mashed smooth with a little breast milk or formula. Mild and naturally sweet, a good first food.
Avocado fingers | Ripe avocado cut into thick strips and rolled in ground oats so they are easy to grip.

My baby's age or stage, and what I want ideas for: `;
}
function renderHaruki() {
  const ed = harukiEditId ? state.haruki.find(x => x.id === harukiEditId) : null;
  if (harukiEditId && !ed) harukiEditId = null;
  const items = state.haruki.slice().sort((a, b) => (a.tried - b.tried) || a.name.localeCompare(b.name));
  let html = `<div class="card">
    <strong>${ed ? "Edit idea" : "Add a food idea"}</strong>
    <label>Name</label>
    <input type="text" id="hName" placeholder="e.g. Sweet potato mash" value="${ed ? esc(ed.name) : ""}">
    <label>Details (what it is, how it's served, how to make it)</label>
    <textarea id="hNote" placeholder="e.g. Steamed sweet potato mashed smooth. Mild and sweet, a good first food.">${ed ? esc(ed.note || "") : ""}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="hSave">${ed ? "Save changes" : "Add idea"}</button>
      ${ed ? `<button class="btn secondary" id="hCancel">Cancel</button>` : ""}
    </div>
  </div>
  <div class="card">
    <strong>⚡ Quick add many ideas</strong>
    <p class="muted" style="margin:6px 0">One idea per line: <code>Name | details</code>. Same name = updates that idea. Tap “Copy AI prompt”, paste it into any AI chat, add what you want ideas for, then paste the answer here.</p>
    <textarea id="hQuick" style="min-height:110px" placeholder="Sweet potato mash | Steamed and mashed smooth. Mild and sweet.&#10;Avocado fingers | Thick strips rolled in ground oats so they are easy to grip.">${esc(harukiDraft)}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="hQuickAdd">Add ideas</button><button class="btn secondary" id="hPrompt">📋 Copy AI prompt</button></div>
    ${harukiMsg ? `<p style="margin:10px 0 0">${esc(harukiMsg)}</p>` : ""}
  </div>
  <h3>Ideas (${items.length})</h3>`;
  if (!items.length) html += `<div class="card empty"><div class="big">🍙</div><p class="muted" style="margin:6px 0 0">No ideas yet. Add one above, or paste a list with Quick add.</p></div>`;
  items.forEach(h => {
    html += `<div class="card ${h.tried ? "tried" : ""}">
      <div class="row"><strong class="grow">${esc(h.name)}</strong>
        <button class="pill ${h.tried ? "on" : ""}" data-htry="${esc(h.id)}">${h.tried ? "✓ Tried" : "Tried?"}</button></div>
      ${h.note ? `<p class="muted" style="margin:6px 0 0;white-space:pre-line">${esc(h.note)}</p>` : ""}
      <div class="row" style="margin-top:10px">
        <button class="btn secondary small" data-hedit="${esc(h.id)}">Edit</button>
        <button class="btn secondary small" data-hdel="${esc(h.id)}">Delete</button></div>
    </div>`;
  });
  const el = $("tab-haruki");
  el.innerHTML = html;
  el.querySelector("#hSave").onclick = () => {
    const name = el.querySelector("#hName").value.trim();
    if (!name) { alert("Give the idea a name."); return; }
    const note = el.querySelector("#hNote").value.trim();
    if (ed) { ed.name = name; ed.note = note; harukiEditId = null; }
    else state.haruki.push({ id: uid(), name, note, tried: false });
    save(); render();
  };
  const c = el.querySelector("#hCancel"); if (c) c.onclick = () => { harukiEditId = null; render(); };
  el.querySelector("#hQuick").oninput = e => { harukiDraft = e.target.value; };
  el.querySelector("#hQuickAdd").onclick = () => {
    harukiMsg = addIdeasFromText(el.querySelector("#hQuick").value);
    harukiDraft = ""; render();
  };
  el.querySelector("#hPrompt").onclick = async () => {
    const t = ideaPrompt();
    try { await navigator.clipboard.writeText(t); harukiMsg = "AI prompt copied. Paste it into any AI chat, add your baby's age and what you want ideas for at the end, then paste the answer in the box above."; render(); }
    catch (e) { prompt("Copy this:", t); }
  };
  el.querySelectorAll("[data-htry]").forEach(b => b.onclick = () => { const h = state.haruki.find(x => x.id === b.dataset.htry); if (h) { h.tried = !h.tried; save(); render(); } });
  el.querySelectorAll("[data-hedit]").forEach(b => b.onclick = () => { harukiEditId = b.dataset.hedit; render(); window.scrollTo(0, 0); });
  el.querySelectorAll("[data-hdel]").forEach(b => b.onclick = () => {
    snap("Idea deleted");
    state.haruki = state.haruki.filter(x => x.id !== b.dataset.hdel);
    save(); render();
  });
}

    const [rid, who] = b.dataset.aroom.split(":");
    snap(who ? "Room assigned" : "Assignments cleared");
    state.cleaning.filter(t => t.room === rid).forEach(t => t.who = who);
    save(); renderClean();
  });
  el.querySelectorAll("[data-cedit]").forEach(inp => inp.onchange = () => {
    const t = state.cleaning.find(x => x.id === inp.dataset.cedit); if (!t) return;
    const v = inp.value.trim();
    if (v) { t.text = v; save(); } else inp.value = t.text;   // an empty name is not allowed
  });
  const add = () => {
    const txt = el.querySelector("#cText").value.trim(); if (!txt) return;
    cleanAddRoom = el.querySelector("#cRoom").value;
    state.cleaning.push({ id: uid(), room: cleanAddRoom, text: txt, done: false, who: "" });
    cleanFocus = true; save(); renderClean();
  };
  const ab = el.querySelector("#cAdd");
  if (ab) {
    ab.onclick = add;
    el.querySelector("#cText").onkeydown = e => { if (e.key === "Enter") add(); };
    el.querySelector("#cRoom").onchange = e => { cleanAddRoom = e.target.value; };
    if (cleanFocus) { cleanFocus = false; el.querySelector("#cText").focus(); }
  }
}

function render() { renderWeek(); renderDishes(); renderShop(); renderHaruki(); renderClean(); }

/* ---------- Shared sync (Firebase Realtime Database, REST) ---------- */
const DEFAULT_SYNC_URL = "https://kimurafoodplan-default-rtdb.europe-west1.firebasedatabase.app";
const SYNC_KEY = "familyFoodPlan.syncUrl";
let blocked = false;   // true when the database holds data from a newer version of this page

function syncUrl() {
  let u = "";
  try { u = localStorage.getItem(SYNC_KEY) || ""; } catch (e) {}
  return (u || DEFAULT_SYNC_URL).trim().replace(/\.json$/, "").replace(/\/+$/, "");
}
function endpoint() { const u = syncUrl(); return u ? u + "/familyplan.json" : ""; }
function setStatus(t) { const el = $("syncStatus"); if (el) el.textContent = t; }
function clock() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

function toRemote() {
  return {
    v: DATA_V,
    dishes: state.dishes.map(d => ({ id: d.id, name: d.name, ingredients: d.ingredients, type: d.type || "other", weekend: !!d.weekend, paused: !!d.paused })),
    week: DAYS.map((_, i) => { const w = state.week[i]; return w ? { dishId: w.dishId || "", locked: !!w.locked, done: !!w.done, cook: w.cook || "", histId: w.histId || "" } : { dishId: "", locked: false, done: false, cook: "", histId: "" }; }),
    checked: Object.keys(state.checked).filter(k => state.checked[k]),
    settings: state.settings,
    pantry: state.pantry,
    extras: state.extras.map(e => ({ id: e.id, text: e.text, done: !!e.done })),
    history: state.history.map(h => ({ id: h.id, dishId: h.dishId, name: h.name, ts: h.ts, cook: h.cook || "" })),
    haruki: state.haruki.map(h => ({ id: h.id, name: h.name, note: h.note || "", tried: !!h.tried })),
    cleanInit: true,   // lets an empty cleaning list stay empty (the database drops empty lists)
    cleaning: state.cleaning.map(t => ({ id: t.id, room: t.room, text: t.text, done: !!t.done, who: t.who || "" })),
    // stored as a list of pairs because database keys can't contain characters like "." or "/"
    groupOverride: Object.entries(state.groupOverride).map(([k, g]) => ({ k, g })),
    updatedAt: state.updatedAt
  };
}
function fromRemote(r) {
  const list = v => Array.isArray(v) ? v : Object.values(v || {});
  const dishes = list(r.dishes).filter(Boolean).map(d => ({ id: d.id, name: d.name, ingredients: list(d.ingredients), type: d.type || "other", weekend: !!d.weekend, paused: !!d.paused }));
  const wk = r.week || {}; const week = {};
  DAYS.forEach((_, i) => { const w = wk[i]; if (w && w.dishId) week[i] = { dishId: w.dishId, locked: !!w.locked, done: !!w.done, cook: w.cook || "", histId: w.histId || "" }; });
  const checked = {}; list(r.checked).forEach(k => checked[k] = true);
  const rs = r.settings || {};
  const settings = Object.assign(defaultSettings(), rs, { excluded: list(rs.excluded) });
  const groupOverride = {}; list(r.groupOverride).filter(Boolean).forEach(o => { if (o.k && o.g) groupOverride[o.k] = o.g; });
  return {
    dishes, week, checked, settings, groupOverride,
    pantry: list(r.pantry).map(String),
    extras: list(r.extras).filter(Boolean).map(e => ({ id: e.id, text: e.text, done: !!e.done })),
    history: list(r.history).filter(Boolean).map(h => ({ id: h.id, dishId: h.dishId, name: h.name, ts: h.ts, cook: h.cook || "" })),
    haruki: list(r.haruki).filter(Boolean).map(h => ({ id: h.id, name: h.name, note: h.note || "", tried: !!h.tried })),
    cleaning: r.cleanInit ? list(r.cleaning).filter(Boolean).map(t => ({ id: t.id, room: t.room, text: t.text, done: !!t.done, who: t.who || "" })) : undefined,
    updatedAt: r.updatedAt || 0
  };
}

let pushTimer = null;
function schedulePush() {
  if (!endpoint()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 300);
}
async function push() {
  const url = endpoint(); if (!url || blocked) return;
  try {
    const r = await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(toRemote()) });
    if (!r.ok) throw new Error(r.status);
    setStatus("✓ Synced " + clock());
  } catch (e) { setStatus("⚠ Can't reach database"); }
}
async function pull(force) {
  const url = endpoint();
  if (!url) { setStatus("Local only"); return; }
  const a = document.activeElement;
  if (!force && a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type === "text"))) return;
  try {
    const r = await fetch(url + "?t=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    const remote = await r.json();
    if (!remote) { await push(); return; }
    if ((remote.v || 0) > DATA_V) { blocked = true; setStatus("⚠ Reload the page to update"); return; }
    const ru = remote.updatedAt || 0;
    if (ru > state.updatedAt) {
      state = fromRemote(remote); ensureState();
      if (editingId && !dishById(editingId)) editingId = null;
      persistLocal(); render();
      setStatus("✓ Synced " + clock());
    } else if (ru < state.updatedAt) {
      await push();
    } else {
      setStatus("✓ Synced " + clock());
    }
  } catch (e) { setStatus("⚠ Can't reach database"); }
}

$("undoBtn").onclick = undo;
$("toastUndo").onclick = undo;
render();
pull(true);
setInterval(() => pull(false), 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(false); });
</script>
